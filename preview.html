<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الهدهد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1120;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }
    .phone-case {
      width: 100%;
      max-width: 360px;
      height: calc(100vh - 20px);
      min-height: 560px;
      background: #020617;
      border: 8px solid #334155;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .speaker {
      width: 84px;
      height: 12px;
      background: #334155;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      margin: 0 auto;
      flex-shrink: 0;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="phone-case">
    <div class="speaker"></div>
    <iframe id="phoneFrame" src="http://127.0.0.1:5000"></iframe>
  </div>

  <script>
    setInterval(() => {
      const frame = document.getElementById("phoneFrame");
      frame.src = "http://127.0.0.1:5000?v=" + Date.now();
    }, 3000);
  </script>
  <footer style="text-align: center; padding: 20px 12px; margin-top: 28px; font-size: 13px; color: #64748b; border-top: 1px solid rgba(148, 163, 184, 0.25); direction: rtl;">
  <div>تم تصميم الموقع بواسطة <strong>زيزو أمير</strong></div>
  <div style="margin-top: 6px;">
    للتواصل: <strong>01070626007</strong> | 
    <a href="https://wa.me/201070626007" target="_blank" style="color: #16a34a; font-weight: bold; text-decoration: none;">
      واتساب
    </a>
  </div>
</footer>
</body>
</html>
